[package]
name = "qubit-codec-binary"
version = "0.6.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-codec-binary"
description = "Buffer-oriented binary codecs for Rust"
homepage = "https://github.com/qubit-ltd/rs-codec-binary"
documentation = "https://docs.rs/qubit-codec-binary"
readme = "README.md"
keywords = ["codec", "binary", "leb128", "zigzag", "qubit"]
categories = ["encoding", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_codec_binary"
doctest = true

[package.metadata.rs-ci]
miri = true
sanitizers = ["address"]

[dependencies]
thiserror = "2.0"
qubit-utils = "0.3"
qubit-codec = "0.14"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "codecs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
